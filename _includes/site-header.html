<header class="site-header" data-site-header>
  <div class="site-header__inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="回到首页">
      <span class="site-brand__mark" aria-hidden="true">嘉</span>
      <span><strong>何嘉华</strong><small>生活花园</small></span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" data-nav-toggle>
      <span></span><span></span><span></span><span class="sr-only">打开导航</span>
    </button>

    <nav class="primary-nav" id="primary-nav" aria-label="主导航" data-primary-nav>
      <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>首页</a>
      <a href="{{ '/vault/' | relative_url }}" {% if page.url contains '/vault/' %}aria-current="page"{% endif %}>目录</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url == '/about/' %}aria-current="page"{% endif %}>关于</a>
      <a href="{{ '/tags/' | relative_url }}" {% if page.url contains '/tags/' %}aria-current="page"{% endif %}>标签</a>
      <a href="{{ '/archives/' | relative_url }}" {% if page.url == '/archives/' %}aria-current="page"{% endif %}>归档</a>
    </nav>

    <button class="theme-toggle" type="button" aria-label="切换到深色模式" title="切换明暗模式" aria-pressed="false" data-theme-toggle>
      <span class="theme-toggle__sun" aria-hidden="true">☀</span>
      <span class="theme-toggle__moon" aria-hidden="true">☾</span>
    </button>
  </div>
</header>
