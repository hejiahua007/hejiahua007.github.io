# Site
title: 何嘉华的生活花园
tagline: 记录生活，也记录成为自己的过程
description: >-
  一个关于生活、阅读、创造和成长的个人数字花园。这里收集何嘉华走过的路、想过的事，以及仍在慢慢成形的作品。
social_image: /assets/config/og-life-garden.jpg
url: "https://hejiahua007.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai

author:
  name: 何嘉华
  email: 19902358463@163.com
  github: hejiahua007

# Content
markdown: kramdown
highlighter: rouge
permalink: /posts/:title/
future: true
show_drafts: false

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      published: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: default
      permalink: /:title/

sass:
  style: compressed

exclude:
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - agents
  - config
  - docs
  - node_modules
  - plan
  - tests
  - tools
  - vendor
