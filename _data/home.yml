eyebrow: "LIFE · NOTES · MAKING"
title: "你好，我是何嘉华。"
lead: "我想认真地生活，也允许自己慢慢来。这里记录读过的书、做过的东西、偶然闪过的念头，以及一个普通人怎样一点点成为自己。"
signature: "慢一点，再慢一点，让时光凝结，让点滴闪烁。"
beliefs:
  - title: 先记录，再解释
    text: 真实发生过的细节，比事后想象出的完美答案更有力量。
  - title: 兴趣也是方向
    text: 阅读、游戏、散步或写软件，都可能成为理解世界的一条小路。
  - title: 允许不完美
    text: 改变不必从宏大计划开始，今天做成一件小事也很好。
likes:
  - 阅读与故事
  - 软件与创造
  - 游戏与幻想
  - 纪录片与远方
  - 散步与观察
  - 与人分享新发现

