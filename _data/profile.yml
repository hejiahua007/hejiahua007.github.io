intro: >-
  我是何嘉华，一个喜欢把模糊念头变成真实东西的人。软件开发占据了生活里不小的一部分，
  但它对我而言更像一种表达方式：发现问题、拆开它、做出一个能用的小工具，再从结果里重新认识自己。
portrait: >-
  我有很强的自我观察欲，也容易把事情想得很远。过去我常用密密麻麻的计划追赶理想中的自己，
  后来逐渐明白，真正能够留下来的往往不是完美执行，而是持续记录、顺着兴趣行动，并在一次次尝试后修正方向。
principles:
  - 保留真实的过程，不只展示漂亮的结果。
  - 把复杂问题拆小，让下一步足够清楚。
  - 对世界保持好奇，也给疲惫留出位置。
  - 作品可以有用，也可以只是让生活多一点趣味。
education:
  school: 广东海洋大学
  major: 物联网工程
  period: 2020 — 2024
experience:
  role: 软件开发工程师
  period: 2024 — 至今
  summary: 参与工业桌面端、设备通信、数据展示和视觉检测相关软件的设计与迭代。
skills:
